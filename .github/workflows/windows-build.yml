name: Windows developer build
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  unsigned-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build developer executable
        shell: cmd
        run: scripts\build_windows.bat
      - name: Upload unsigned developer package
        uses: actions/upload-artifact@v4
        with:
          name: LocalMoEStudio-Windows-unsigned
          path: dist/LocalMoEStudio
          retention-days: 14
