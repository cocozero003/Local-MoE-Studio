name: Build signed Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing and data secrets
        shell: pwsh
        env:
          DATA_URL: ${{ secrets.THAI_FDA_DATA_PACK_URL }}
          DATA_SHA: ${{ secrets.THAI_FDA_DATA_PACK_SHA256 }}
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:DATA_URL) { throw "Missing THAI_FDA_DATA_PACK_URL" }
          if (-not $env:DATA_SHA) { throw "Missing THAI_FDA_DATA_PACK_SHA256" }
          if (-not $env:PFX_B64) { throw "Missing WINDOWS_SIGNING_PFX_BASE64" }
          if (-not $env:PFX_PASSWORD) { throw "Missing WINDOWS_SIGNING_PFX_PASSWORD" }

      - name: Download controlled data pack
        shell: pwsh
        env:
          DATA_URL: ${{ secrets.THAI_FDA_DATA_PACK_URL }}
          DATA_SHA: ${{ secrets.THAI_FDA_DATA_PACK_SHA256 }}
        run: |
          Invoke-WebRequest -Uri $env:DATA_URL -OutFile ThaiFDA_DataPack.zip
          $actual=(Get-FileHash ThaiFDA_DataPack.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:DATA_SHA.ToLowerInvariant()) {
            throw "Thai FDA data pack SHA256 mismatch"
          }

      - name: Build Windows EXE with bundled data
        shell: pwsh
        run: |
          ./installer/windows/build_installer.ps1 -DataPack "./ThaiFDA_DataPack.zip" -OutputDir "dist"

      - name: Restore code-signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\publisher.pfx",[Convert]::FromBase64String($env:PFX_B64))

      - name: Authenticode sign, timestamp, and verify
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./installer/windows/sign_installer.ps1 -ExePath "./dist/ThaiFDA_LocalMoE_Setup.exe" -PfxPath "$env:RUNNER_TEMP\publisher.pfx" -PfxPassword $env:PFX_PASSWORD
          Remove-Item "$env:RUNNER_TEMP\publisher.pfx" -Force

      - name: Record SHA256
        shell: pwsh
        run: |
          Get-FileHash "./dist/ThaiFDA_LocalMoE_Setup.exe" -Algorithm SHA256 | Format-List | Out-File "./dist/SHA256.txt"

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: ThaiFDA-LocalMoE-Signed-Windows-Installer
          path: |
            dist/ThaiFDA_LocalMoE_Setup.exe
            dist/SHA256.txt
          if-no-files-found: error
